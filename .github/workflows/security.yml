name: Security

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 1"  # Mondays: new CVEs appear without a code change
  workflow_dispatch:
  # docker-publish.yml runs this on the exact commit it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  dependencies:
    name: pip-audit (uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - name: Install uv
        run: pip install uv==0.13.5
      - name: Audit exactly what the image installs
        run: |
          uv export --frozen --all-extras --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps --strict -r /tmp/requirements.txt

  # grype is the vulnerability gate: Trivy rated v2.2.1's zlib CVE MEDIUM (grype:
  # High), so its CRITICAL,HIGH filter passed an image with a fixed High CVE, and
  # it does not match the python binary at all. Trivy stays for secrets only.
  image:
    name: Image scan (grype, Trivy secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: openwhistle:scan
          cache-from: type=gha
          # A cached final stage would scan last month's `apk upgrade`.
          no-cache-filters: final
      # Fails on any vulnerability with a fix, whatever its severity; the
      # exceptions are reviewed one by one in .grype.yaml.
      - uses: docker://anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
        with:
          args: docker:openwhistle:scan --config .grype.yaml --only-fixed --fail-on negligible
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openwhistle:scan
          scanners: secret
          exit-code: "1"

  # What users pull today: the image goes stale between releases while Alpine
  # and Python publish fixes. A red Monday here means: cut a patch release.
  published:
    name: Image scan (published :latest)
    # Not when docker-publish.yml calls this file: a called workflow sees the caller's
    # event, so a dispatched re-publish scanned the :latest it was about to replace.
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
      && !contains(github.workflow_ref, '/docker-publish.yml@'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker://anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
        with:
          args: registry:ghcr.io/openwhistle/openwhistle:latest --config .grype.yaml --only-fixed --fail-on negligible
