name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.12.18

      - name: OpenLDAP headers (python-ldap builds from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install dependencies
        # Exactly the versions in uv.lock, so CI tests what the image ships.
        run: |
          uv export --frozen --extra dev --extra ldap --extra s3 --no-emit-project -o /tmp/requirements.txt
          uv pip install --system -r /tmp/requirements.txt

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Run ruff (linting)
        run: ruff check .

      - name: Spelling (codespell)
        run: uvx codespell==2.4.3

      - name: Run mypy (type checking)
        run: mypy app/ --strict

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !.venv
            !node_modules
            !.superpowers
            !.claude
            !.serena

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openwhistle
          POSTGRES_PASSWORD: openwhistle
          POSTGRES_DB: openwhistle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      # tests/test_v160_privacy.py runs base.html's time formatter in Node.
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install uv
        run: pip install uv==0.12.18

      - name: OpenLDAP headers (python-ldap builds from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          uv export --frozen --extra dev --extra ldap --extra s3 --no-emit-project -o /tmp/requirements.txt
          uv pip install --system -r /tmp/requirements.txt
          uv pip install --system --no-deps -e .

      - name: Run tests
        env:
          DATABASE_URL: "postgresql+asyncpg://openwhistle:openwhistle@localhost:5432/openwhistle_test"
          REDIS_URL: "redis://localhost:6379/1"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          DEMO_MODE: "true"
          COVERAGE_CORE: "sysmon"
        run: pytest --cov=app --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
        continue-on-error: true

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: openwhistle:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — start full stack and verify /health
        run: |
          # Write a minimal compose override for CI
          cat > docker-compose.ci.yml <<'EOF'
          services:
            app:
              image: openwhistle:ci
              environment:
                DATABASE_URL: "postgresql+asyncpg://openwhistle:openwhistle@db:5432/openwhistle"
                REDIS_URL: "redis://redis:6379/0"
                SECRET_KEY: "ci-smoke-test-secret-not-for-production"
                DEMO_MODE: "false"
              ports:
                - "4009:4009"
              depends_on:
                db:
                  condition: service_healthy
                redis:
                  condition: service_healthy
            db:
              image: postgres:18-alpine
              environment:
                POSTGRES_USER: openwhistle
                POSTGRES_PASSWORD: openwhistle
                POSTGRES_DB: openwhistle
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U openwhistle -d openwhistle"]
                interval: 5s
                timeout: 5s
                retries: 10
            redis:
              image: redis:8-alpine
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 5s
                retries: 10
          EOF

          docker compose -f docker-compose.ci.yml up -d

          # Wait up to 60s for /health to return 200
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4009/health || true)
            if [ "$status" = "200" ]; then
              echo "✓ Health check passed (attempt $i)"
              break
            fi
            echo "Attempt $i: status=$status — waiting..."
            sleep 2
          done

          # Assert health endpoint returns ok
          response=$(curl -s http://localhost:4009/health)
          echo "Response: $response"
          echo "$response" | grep -q '"status":"ok"'

          # Assert /setup is reachable (wizard available on fresh DB)
          setup_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4009/setup)
          echo "Setup page status: $setup_status"
          [ "$setup_status" = "200" ]

          docker compose -f docker-compose.ci.yml down -v

  nginx-onion-trust:
    # Runs the SHIPPED nginx image against the repo's real nginx.conf +
    # snippets/*.conf (not a copy, not a string match) with a tiny
    # header-echoing backend standing in for the app, and asserts with real
    # HTTP requests that the client can never forge the X-OW-Onion /
    # IP-forwarding trust headers the app relies on (see app/onion.py,
    # nginx/snippets/proxy-headers.conf, docs/docs.html "Onion listener
    # trust boundary"). A CI job, not a pytest, so it always runs on GitHub's
    # Docker-equipped runners rather than skipping when a contributor's
    # machine lacks docker/podman.
    #
    # Also renders ansible/roles/openwhistle/templates/nginx.conf.j2 with the
    # role's own defaults (a tiny Jinja2 render, no Ansible install needed)
    # and re-runs the TLS-listener assertion against it, over the SAME
    # nginx/snippets/*.conf files — the Ansible deployment (the live demo)
    # has no onion listener, but must still clear X-OW-Onion so a client
    # can't spoof onion-listener behaviour against it (non-Secure cookies,
    # no HSTS) — see "single source" in deploy.yml's "Copy the shared nginx
    # snippets" task.
    name: nginx onion-listener trust boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.12.18

      - name: Set up a throwaway TLS cert and a header-echoing backend
        run: |
          mkdir -p /tmp/ow-nginx-test/tls /tmp/ow-nginx-test/echo
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/ow-nginx-test/tls/privkey.pem \
            -out /tmp/ow-nginx-test/tls/fullchain.pem \
            -days 1 -nodes -subj "/CN=test"
          cat > /tmp/ow-nginx-test/echo/server.py <<'PY'
          import http.server

          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.end_headers()
                  for k, v in self.headers.items():
                      self.wfile.write(f"{k}: {v}\n".encode())

          http.server.HTTPServer(("0.0.0.0", 4009), H).serve_forever()
          PY

      - name: Start the backend and the shipped nginx image
        run: |
          docker network create ow-onion-test

          # python:3-alpine
          docker run -d --name ow-onion-test-app --network ow-onion-test \
            --network-alias app \
            -v /tmp/ow-nginx-test/echo/server.py:/server.py:ro \
            python@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01 \
            python /server.py

          # nginx:alpine — the exact image docker-compose.prod.yml ships
          docker run -d --name ow-onion-test-nginx --network ow-onion-test \
            -p 18443:443 -p 18080:8080 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            -v /tmp/ow-nginx-test/tls:/etc/nginx/tls:ro \
            nginx@sha256:1ed1b0e1d7652937d6cbdaf4018c7b6fc009a7dd6c3047351e2eddda745de43f

          for i in $(seq 1 15); do
            curl -sk https://localhost:18443/ -o /dev/null && break
            sleep 1
          done

      - name: TLS (443) never forwards a client-forged trust header
        run: |
          out=$(curl -sk https://localhost:18443/ \
            -H "X-OW-Onion: 1" -H "x-ow-onion: 1" \
            -H "X-Forwarded-For: 1.2.3.4" -H "X-Real-IP: 1.2.3.4" \
            -H "X_OW_Onion: 1")
          echo "$out"
          ! grep -qi '^x-ow-onion:' <<< "$out"
          ! grep -qi '^x-forwarded-for:' <<< "$out"
          ! grep -qi '^x-real-ip:' <<< "$out"
          ! grep -qi '^x.ow.onion:' <<< "$out"

      - name: Onion (8080) forces X-OW-Onion to exactly "1", strips IP headers
        run: |
          out=$(curl -s http://localhost:18080/ \
            -H "X-OW-Onion: 0" -H "X-OW-Onion: 0" \
            -H "X-Forwarded-For: 1.2.3.4" -H "X-Real-IP: 1.2.3.4")
          echo "$out"
          grep -qx 'X-OW-Onion: 1' <<< "$out"
          ! grep -qi '^x-forwarded-for:' <<< "$out"
          ! grep -qi '^x-real-ip:' <<< "$out"

      - name: Render nginx.conf.j2 with the Ansible role's own defaults
        # jinja2 (direct dependency) and pyyaml (via uvicorn[standard]) are
        # both already resolved in uv.lock, so `uv run --frozen` gives an
        # exactly-locked environment for the render — no bare/unpinned `pip
        # install`, consistent with every other dependency install in this
        # repo (see test_build_pins.py::test_no_bare_pip_install_in_any_workflow).
        run: |
          cat > /tmp/render_ansible_nginx.py <<'PY'
          import yaml
          from jinja2 import Environment

          with open("ansible/roles/openwhistle/defaults/main.yml") as f:
              data = yaml.safe_load(f)

          # Ansible's `bool` filter, reimplemented just enough for this
          # template's one use — openwhistle_tls_enabled is already a native
          # YAML bool here, so this is mostly a pass-through.
          def _bool(v):
              if isinstance(v, bool):
                  return v
              return str(v).strip().lower() in ("true", "yes", "1", "on")

          env = Environment()
          env.filters["bool"] = _bool

          with open("ansible/roles/openwhistle/templates/nginx.conf.j2") as f:
              tmpl = env.from_string(f.read())

          # openwhistle_domain defaults to "" (documented as required in
          # production); give it a real value so server_name/the cert paths
          # are valid — the only override, everything else is the role's own
          # default straight from defaults/main.yml.
          data["openwhistle_domain"] = "ow-ansible-test.example.com"
          with open("/tmp/ow-nginx-test/ansible-nginx.conf", "w") as f:
              f.write(tmpl.render(**data))
          PY
          uv run --frozen python3 /tmp/render_ansible_nginx.py
          cat /tmp/ow-nginx-test/ansible-nginx.conf

      - name: Start nginx with the rendered nginx.conf.j2 (same snippets, same backend)
        run: |
          mkdir -p /tmp/ow-nginx-test/letsencrypt/live/ow-ansible-test.example.com
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/ow-nginx-test/letsencrypt/live/ow-ansible-test.example.com/privkey.pem \
            -out /tmp/ow-nginx-test/letsencrypt/live/ow-ansible-test.example.com/fullchain.pem \
            -days 1 -nodes -subj "/CN=ow-ansible-test.example.com"

          # Same nginx:alpine image, same nginx/snippets/*.conf, same "app"
          # backend on ow-onion-test — only nginx.conf itself differs.
          docker run -d --name ow-onion-test-nginx-ansible --network ow-onion-test \
            -p 28443:443 \
            -v /tmp/ow-nginx-test/ansible-nginx.conf:/etc/nginx/nginx.conf:ro \
            -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            -v /tmp/ow-nginx-test/letsencrypt:/etc/letsencrypt:ro \
            nginx@sha256:1ed1b0e1d7652937d6cbdaf4018c7b6fc009a7dd6c3047351e2eddda745de43f

          for i in $(seq 1 15); do
            curl -sk https://localhost:28443/ -o /dev/null && break
            sleep 1
          done

      - name: Ansible-rendered TLS (443) never forwards a client-forged trust header
        run: |
          out=$(curl -sk https://localhost:28443/ \
            -H "X-OW-Onion: 1" -H "x-ow-onion: 1" \
            -H "X-Forwarded-For: 1.2.3.4" -H "X-Real-IP: 1.2.3.4" \
            -H "X_OW_Onion: 1")
          echo "$out"
          ! grep -qi '^x-ow-onion:' <<< "$out"
          ! grep -qi '^x-forwarded-for:' <<< "$out"
          ! grep -qi '^x-real-ip:' <<< "$out"
          ! grep -qi '^x.ow.onion:' <<< "$out"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ow-onion-test-app ow-onion-test-nginx ow-onion-test-nginx-ansible || true
          docker network rm ow-onion-test || true
