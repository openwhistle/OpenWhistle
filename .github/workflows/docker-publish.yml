name: Publish Docker Images

# One build, three registries. Each platform is built natively and pushed to
# GHCR by digest; the merge job then writes the same multi-arch index under
# every tag to GHCR, Docker Hub and Quay.io, signs it in all three, and proves
# that every tag and every platform manifest behind it can be pulled.
#
#   push to main  -> :edge, :sha-<sha>
#   tag vX.Y.Z    -> :X.Y.Z, :X.Y, :X, :latest, :sha-<sha>
#
# Re-publishing an old release: `gh workflow run docker-publish.yml --ref vX.Y.Z`.
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: openwhistle
  GHCR_IMAGE: ghcr.io/openwhistle/openwhistle

# Never cancel a publish half way: a cancelled merge leaves tags pointing at
# whatever the previous run wrote.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Build each platform on a native runner, push by digest only ──────────
  # Emulating arm64 with QEMU inside one buildx run is several times slower;
  # arm64 runners are free for public repositories.
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Platform suffix
        id: platform
        run: echo "suffix=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.suffix }}
          provenance: true
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Tag, sign and verify in all three registries ─────────────────────────
  merge:
    name: Tag, sign and verify
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing
    # The secrets context is not available in a step's `if:`; env is.
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Tags for all registries
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            quay.io/${{ secrets.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=edge,branch=main
            type=sha,prefix=sha-

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: env.QUAY_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # GHCR must succeed. Docker Hub must succeed when configured. Quay is
      # best-effort: a failure there is a warning, not a lost release.
      - name: Create, sign and verify the multi-arch index
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          sources=$(printf "${GHCR_IMAGE}@sha256:%s " *)

          # Explicit `|| return 1`: under `publish ... || warn`, set -e is off.
          publish() {
            local registry="$1" tags first repo digest
            tags=$(jq -r --arg r "$registry" '.tags[] | select(startswith($r))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            [[ -z "$tags" ]] && return 0
            first=$(head -n1 <<< "$tags")
            repo="${first%:*}"
            # shellcheck disable=SC2046,SC2086
            docker buildx imagetools create $(printf -- '-t %s ' $tags) $sources || return 1
            digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest) || return 1
            cosign sign --yes "${repo}@${digest}" || return 1

            # A 200 on the index proves nothing: v1.3.0's tags answered 200
            # while every platform manifest behind them had been deleted.
            for tag in $tags; do
              for child in $(docker buildx imagetools inspect --raw "$tag" | jq -r '.manifests[].digest'); do
                docker buildx imagetools inspect --raw "${repo}@${child}" > /dev/null \
                  || { echo "::error::${tag}: platform manifest ${child} is not pullable"; return 1; }
              done
              echo "verified ${tag} -> ${digest}"
            done
          }

          publish "ghcr.io"
          if [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then publish "docker.io"; fi
          if [[ -n "${QUAY_TOKEN:-}" ]]; then
            publish "quay.io" || echo "::warning title=Quay.io not updated::GHCR and Docker Hub are published and verified; rerun this job once quay.io is reachable."
          fi
