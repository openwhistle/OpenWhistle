name: AI disclosure

# Labels an issue or pull request whose description carries the disclosure that
# AGENTS.md and the templates ask AI agents for. pull_request_target runs with a
# write token, so nothing from the fork is checked out or run: the text is only
# read from an environment variable and matched.
on: # zizmor: ignore[dangerous-triggers] — safe as above; tests/test_ai_disclosure.py pins it
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label when the disclosure is present
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          TEXT: ${{ github.event.issue.body || github.event.pull_request.body }}
        run: |
          # A here-string, not a pipe: the result is grep's own, whatever the shell's pipefail
          # setting (on with `shell: bash`); in a piped form grep -q leaving early could fail it.
          if grep -Pzq '\[!WARNING\][ \t]*\n>[ \t]*AI-generated' <<< "${TEXT//$'\r'/}"; then
            gh api -X POST "repos/$GH_REPO/issues/$NUMBER/labels" -f "labels[]=ai-generated" >/dev/null
          fi
