name: External links

# Every link from openwhistle.net to another host, weekly: a dead one opens an
# issue. 401/403/429 are printed as unverifiable and never fail the run.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/check_external_links.py"
      - ".github/workflows/links.yml"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.12.23

      - name: Install the site build
        run: |
          uv export --frozen --only-group site --no-emit-project -o /tmp/requirements.txt
          uv pip install --system -r /tmp/requirements.txt

      # No pipe: without an explicit `shell: bash` a step runs without pipefail,
      # so `| tee` would make the step's status tee's.
      - name: Check
        id: check
        run: python scripts/check_external_links.py > links.txt 2>&1
        continue-on-error: true

      - name: Show the result
        run: cat links.txt

      - name: Open an issue
        if: steps.check.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="External links broken on openwhistle.net"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)
          if [ "$open" = 0 ]; then gh issue create --title "$title" --body-file links.txt; fi

      - name: Fail
        if: steps.check.outcome == 'failure'
        run: exit 1
