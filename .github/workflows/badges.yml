name: Badges

# Publishes the i18n coverage as a shields.io endpoint file on the `badges` branch.
# Nothing generated lands on main; no third-party service receives repository data.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

jobs:
  i18n:
    name: i18n coverage badge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # push the badges branch, this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compute the badge
        run: python3 scripts/i18n_coverage.py --badge "$RUNNER_TEMP/i18n.json"
      - name: Publish it to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          cp "$RUNNER_TEMP/i18n.json" .
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n.json
          git commit -q -m "i18n coverage badge"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges
