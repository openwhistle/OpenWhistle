name: E2E Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # docker-publish.yml runs this on the exact commit it publishes.
  workflow_call:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.12.24

      - name: OpenLDAP headers (python-ldap builds from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install E2E dependencies
        run: |
          uv export --frozen --extra dev --extra ldap --extra s3 --extra e2e --group site --no-emit-project -o /tmp/requirements.txt
          uv pip install --system -r /tmp/requirements.txt
          uv pip install --system --no-deps -e .
          playwright install chromium --with-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: openwhistle:e2e
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start full stack with demo data
        run: |
          docker compose -f docker-compose.e2e.yml up -d

          echo "Waiting for app to be healthy..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4009/health || true)
            if [ "$status" = "200" ]; then
              echo "App is healthy (attempt $i)"
              break
            fi
            echo "Attempt $i: status=$status — waiting 3s..."
            sleep 3
          done

          # Final health check — fail fast if not healthy
          curl -sf http://localhost:4009/health | grep -q '"status":"ok"'

      - name: Run Playwright E2E tests
        run: |
          pytest tests/e2e/ \
            -m e2e \
            --base-url http://localhost:4009 \
            --browser chromium \
            -v \
            --tb=short \
            --no-cov
        continue-on-error: false

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
