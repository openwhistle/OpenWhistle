# Reviewed exceptions to the image scan (security.yml, docker-publish.yml), which
# fails on every vulnerability that has a fix. Each entry names the exact package
# version: when the package moves, the entry stops matching and the new version is
# judged afresh, so an exception expires by itself. tests/test_image_scan.py
# requires a reason and a version on every entry.
ignore:
  - vulnerability: CVE-2025-15367
    package:
      name: python
      version: 3.15.0
      type: binary
    reason: >-
      False positive: grype orders 3.15.0 before the fix release 3.15.0a6. 3.15.0 has the fix:
      poplib.POP3._putcmd raises ValueError on control characters (checked in the
      python:3.15-alpine image this Dockerfile pins).
