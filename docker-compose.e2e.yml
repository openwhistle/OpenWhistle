services:
  app:
    build: .
    image: openwhistle:e2e
    # As docker-compose.prod.yml and the Helm chart run it: a runtime write outside
    # /tmp, or a need for a capability, fails here instead of first in production.
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: "postgresql+asyncpg://openwhistle:openwhistle@db:5432/openwhistle"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "e2e-test-secret-key-not-for-production-use"
      DEMO_MODE: "true"
    ports:
      - "4009:4009"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: openwhistle
      POSTGRES_PASSWORD: openwhistle
      POSTGRES_DB: openwhistle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwhistle -d openwhistle"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
