services:
  app:
    build: .
    image: openwhistle:e2e
    # As docker-compose.prod.yml and the Helm chart run it: a runtime write outside
    # /tmp, or a need for a capability, fails here instead of first in production.
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: "postgresql+asyncpg://openwhistle:openwhistle@db:5432/openwhistle"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "e2e-test-secret-key-not-for-production-use"
      DEMO_MODE: "true"
    ports:
      - "4009:4009"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: openwhistle
      POSTGRES_PASSWORD: openwhistle
      POSTGRES_DB: openwhistle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwhistle -d openwhistle"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine@sha256:47b08295737773de3b711fb86f13ae802f5074e96a9a2d29f5f80164ac08c046
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
