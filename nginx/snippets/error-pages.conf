# Responses nginx itself generates (413 body too large, 429 rate limit, 502/503/504
# upstream down or slow) never pass the app's SecurityMiddleware, so they carried
# none of its headers. This snippet gives them the same ones. Included in every
# server block that proxies to the app, next to proxy-headers.conf.
#
# error_page only fires for nginx's own errors (proxy_intercept_errors stays off):
# an error the app produces keeps the app's headers, and add_header here never
# runs on a proxied response, so nothing is sent twice (GHSA-gh23-4h5j-cqj8).
# $ow_hsts comes from the `map` in each nginx.conf: empty on the plain-HTTP onion
# listener (RFC 6797 §8.1), where add_header then omits the header.
error_page 413 @ow_err_413;
error_page 429 @ow_err_429;
error_page 502 @ow_err_502;
error_page 503 @ow_err_503;
error_page 504 @ow_err_504;

location @ow_err_413 { include /etc/nginx/snippets/error-headers.conf; return 413; }
location @ow_err_429 { include /etc/nginx/snippets/error-headers.conf; return 429; }
location @ow_err_502 { include /etc/nginx/snippets/error-headers.conf; return 502; }
location @ow_err_503 { include /etc/nginx/snippets/error-headers.conf; return 503; }
location @ow_err_504 { include /etc/nginx/snippets/error-headers.conf; return 504; }
