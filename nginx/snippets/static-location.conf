# Proxies /static/ like every other path (nginx does not serve these files
# itself). Shared between the TLS (443) and onion (8080) server blocks — see
# proxy-headers.conf.
#
# No `expires`/`add_header Cache-Control` here: the app (SecurityMiddleware,
# app/middleware.py) is the single authoritative source for this header, the
# same rule the security headers above already follow — `add_header` appends
# rather than replaces an upstream header, so a second Cache-Control here
# would conflict with the app's `no-cache` (GHSA-gh23-4h5j-cqj8 was this same
# class of bug for the security headers).
location /static/ {
    proxy_pass http://openwhistle;
}
