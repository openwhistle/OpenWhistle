# Shared proxy headers for every server block that proxies to the app (the
# TLS listener on 443 and the onion listener on 8080). Kept in one file so a
# stripped IP header, or a proxy setting change, cannot land in one server
# block and be forgotten in the other — tests/test_tls.py checks this file
# directly, and that both server blocks `include` it.

# ─── Strip ALL IP-forwarding headers ─────────────────────────────────────
# Even if an upstream CDN or proxy (Cloudflare, Traefik) adds these headers,
# they are stripped before passing to the application. The list is the app's
# own (_IP_REVEAL_HEADERS in app/middleware.py, which strips them again);
# tests/test_v230_bug_bounty.py fails while one is missing here. A header no
# list knows still passes both: the app port must stay unreachable from
# anything but this nginx.
proxy_set_header X-Forwarded-For           "";
proxy_set_header X-Real-IP                 "";
proxy_set_header Forwarded                 "";
proxy_set_header X-Client-IP               "";
proxy_set_header X-Cluster-Client-IP       "";
proxy_set_header True-Client-IP            "";
proxy_set_header CF-Connecting-IP          "";
proxy_set_header CF-Connecting-IPv6        "";
proxy_set_header CF-Pseudo-IPv4            "";
proxy_set_header X-Original-Forwarded-For  "";
proxy_set_header Fastly-Client-IP          "";
proxy_set_header X-Envoy-External-Address  "";
proxy_set_header X-Azure-ClientIP          "";
proxy_set_header X-Azure-SocketIP          "";
proxy_set_header X-AppEngine-User-IP       "";
proxy_set_header Fly-Client-IP             "";
proxy_set_header X-NF-Client-Connection-IP "";
proxy_set_header Incap-Client-IP           "";
proxy_set_header X-Vercel-Forwarded-For    "";
proxy_set_header X-ProxyUser-IP            "";
proxy_set_header X-Originating-IP          "";
proxy_set_header X-Forwarded               "";
proxy_set_header Client-IP                 "";

# Standard proxy headers (without IP)
proxy_set_header Host               $host;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";

# ─── Onion listener assertion ─────────────────────────────────────────────
# The app must never decide "this is the onion listener" from the
# client-supplied Host header — a client on the real TLS listener could send
# any Host it likes and get non-Secure cookies / no HSTS on a connection that
# genuinely is TLS. nginx asserts it instead: cleared here for every server
# block that includes this file, and set back to "1" only in the onion
# (8080) block, after its own `include` of this file — the same
# override-after-include pattern used for the IP-forwarding headers above.
# This means the app port must be reachable only through this nginx, exactly
# as already required for the IP-header stripping to hold.
proxy_set_header X-OW-Onion "";
