worker_processes auto;
# crit only: nginx prefixes request-level errors (429 rate limit, 413 body
# too large) with the client address, which must never be logged.
error_log /dev/stderr crit;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Privacy: disable ALL access logging ─────────────────────────────
    # Required for whistleblower anonymity — nginx must never log IP addresses.
    # This disables the access log globally.
    access_log off;
    log_not_found off;

    # Server tokens (hide nginx version)
    server_tokens off;

    # ─── Flood protection ────────────────────────────────────────────────
    # Keys on the client IP for in-memory rate limiting only — the IP is never
    # logged (access_log off) or forwarded upstream (stripped below), so
    # anonymity is preserved while abusive request bursts are throttled.
    limit_req_zone $binary_remote_addr zone=ow_req:10m rate=10r/s;
    # The onion listener (8080) is reached only via the host's own Tor daemon
    # terminating HiddenServicePort — every visitor's connection to nginx
    # therefore comes from 127.0.0.1, whoever they are on the Tor side. Keying
    # on the client IP there would give every simultaneous Tor visitor ONE
    # shared bucket by coincidence of the setup, not by design; keying on a
    # literal constant makes that explicit, and the higher rate/burst below
    # sizes that one shared budget for several concurrent legitimate
    # reporters instead of a single office network's worth of requests. See
    # "Offering an onion address" in docs/docs.html for the operator-facing
    # version of this note.
    limit_req_zone "onion" zone=ow_req_onion:10m rate=30r/s;
    limit_req_status 429;
    limit_req_log_level info;

    # 5 attachments x 10 MB (app/services/attachment.py) plus form overhead.
    client_max_body_size 55m;

    # ─── Upstream: OpenWhistle application ───────────────────────────────
    upstream openwhistle {
        server app:4009;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:ow_tls:10m;
        ssl_session_tickets off;

        include /etc/nginx/snippets/proxy-headers.conf;

        location / {
            # Generous burst so the multi-step submission wizard and normal
            # admin use are unaffected; blocks rapid automated floods.
            limit_req zone=ow_req burst=30 nodelay;
            proxy_pass http://openwhistle;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        include /etc/nginx/snippets/static-location.conf;
    }

    # Plain HTTP only redirects; nothing is proxied without TLS. HSTS is set by the app.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Tor onion service entry (published on 127.0.0.1 only; see "Offering an
    # onion address" in docs/docs.html). Tor encrypts end to end, so the
    # onion service reaches nginx over plain HTTP from the host itself.
    server {
        listen 8080;
        server_name _;

        include /etc/nginx/snippets/proxy-headers.conf;
        # Authoritative: this is the only place X-OW-Onion is ever set to
        # "1" — after the include above, so it overrides that file's own
        # blanket clear for this block only. The app trusts this header,
        # never the client-supplied Host, to decide "onion or not" (see
        # app/onion.py and snippets/proxy-headers.conf).
        proxy_set_header X-OW-Onion "1";

        location / {
            # ow_req_onion, not ow_req: see the zone's own comment above —
            # every onion visitor shares one 127.0.0.1 connection to nginx,
            # so this is one shared budget for all of them, sized higher.
            limit_req zone=ow_req_onion burst=90 nodelay;
            proxy_pass http://openwhistle;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        include /etc/nginx/snippets/static-location.conf;
    }
}

# ─── Notes for operators using Cloudflare or other CDNs ──────────────────────
#
# If you run OpenWhistle behind Cloudflare:
# 1. Enable "Remove visitor IPs from logs" in Cloudflare dashboard
# 2. Do NOT use Cloudflare's "Restore visitor IP" feature (it adds CF-Connecting-IP)
# 3. The nginx config above strips CF-Connecting-IP, but you should also
#    configure Cloudflare to not add it to begin with.
#
# If you run OpenWhistle behind Traefik:
# - Set `headers.customRequestHeaders.X-Forwarded-For = ""` in your middleware
# - Set `headers.customRequestHeaders.X-Real-IP = ""`
# - Set `headers.customRequestHeaders.True-Client-IP = ""`
#
# After changing your proxy configuration, dismiss the IP warning in the
# OpenWhistle admin dashboard to confirm the fix.
