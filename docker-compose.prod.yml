services:
  app:
    image: ghcr.io/openwhistle/openwhistle:${OPENWHISTLE_VERSION:-2.0.0}
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      SECRET_KEY: "${SECRET_KEY}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      ENCRYPTION_KEY_PREVIOUS: "${ENCRYPTION_KEY_PREVIOUS:-}"
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      DEMO_MODE: "${DEMO_MODE:-false}"
      SECURE_COOKIES: "${SECURE_COOKIES:-true}"
      SESSION_MAX_HOURS: "${SESSION_MAX_HOURS:-12}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      ALGORITHM: "${ALGORITHM:-HS256}"
      MAX_ACCESS_ATTEMPTS: "${MAX_ACCESS_ATTEMPTS:-5}"
      ACCESS_LOCKOUT_MINUTES: "${ACCESS_LOCKOUT_MINUTES:-15}"
      MAX_LOGIN_ATTEMPTS: "${MAX_LOGIN_ATTEMPTS:-10}"
      LOGIN_LOCKOUT_MINUTES: "${LOGIN_LOCKOUT_MINUTES:-30}"
      ADMIN_FAILED_LOGIN_ALERT_THRESHOLD: "${ADMIN_FAILED_LOGIN_ALERT_THRESHOLD:-50}"
      ADMIN_FAILED_LOGIN_ALERT_WINDOW_MINUTES: "${ADMIN_FAILED_LOGIN_ALERT_WINDOW_MINUTES:-15}"
      SUBMISSION_MODE_ENABLED: "${SUBMISSION_MODE_ENABLED:-true}"
      APP_NAME: "${APP_NAME:-OpenWhistle}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_SERVER_METADATA_URL: "${OIDC_SERVER_METADATA_URL:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      LDAP_ENABLED: "${LDAP_ENABLED:-false}"
      LDAP_SERVER: "${LDAP_SERVER:-}"
      LDAP_PORT: "${LDAP_PORT:-389}"
      LDAP_USE_SSL: "${LDAP_USE_SSL:-false}"
      LDAP_START_TLS: "${LDAP_START_TLS:-false}"
      LDAP_BIND_DN: "${LDAP_BIND_DN:-}"
      LDAP_BIND_PASSWORD: "${LDAP_BIND_PASSWORD:-}"
      LDAP_BASE_DN: "${LDAP_BASE_DN:-}"
      LDAP_USER_FILTER: "${LDAP_USER_FILTER:-(uid={username})}"
      LDAP_ATTR_USERNAME: "${LDAP_ATTR_USERNAME:-uid}"
      LDAP_ATTR_EMAIL: "${LDAP_ATTR_EMAIL:-mail}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-db}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_BUCKET_NAME: "${S3_BUCKET_NAME:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_PREFIX: "${S3_PREFIX:-attachments/}"
      REMINDER_ENABLED: "${REMINDER_ENABLED:-false}"
      REMINDER_ACK_WARN_DAYS: "${REMINDER_ACK_WARN_DAYS:-2}"
      REMINDER_FEEDBACK_WARN_DAYS: "${REMINDER_FEEDBACK_WARN_DAYS:-30}"
      BRAND_PRIMARY_COLOR: "${BRAND_PRIMARY_COLOR:-#0c7253}"
      BRAND_LOGO_URL: "${BRAND_LOGO_URL:-}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost}"
      ONION_LOCATION: "${ONION_LOCATION:-}"
      NOTIFY_EMAIL_ENABLED: "${NOTIFY_EMAIL_ENABLED:-false}"
      NOTIFY_EMAIL_TO: "${NOTIFY_EMAIL_TO:-}"
      NOTIFY_EMAIL_FROM: "${NOTIFY_EMAIL_FROM:-openwhistle@localhost}"
      NOTIFY_SMTP_HOST: "${NOTIFY_SMTP_HOST:-localhost}"
      NOTIFY_SMTP_PORT: "${NOTIFY_SMTP_PORT:-587}"
      NOTIFY_SMTP_USER: "${NOTIFY_SMTP_USER:-}"
      NOTIFY_SMTP_PASSWORD: "${NOTIFY_SMTP_PASSWORD:-}"
      NOTIFY_SMTP_TLS: "${NOTIFY_SMTP_TLS:-true}"
      NOTIFY_SMTP_SSL: "${NOTIFY_SMTP_SSL:-false}"
      NOTIFY_WEBHOOK_ENABLED: "${NOTIFY_WEBHOOK_ENABLED:-false}"
      NOTIFY_WEBHOOK_URL: "${NOTIFY_WEBHOOK_URL:-}"
      NOTIFY_WEBHOOK_SECRET: "${NOTIFY_WEBHOOK_SECRET:-}"
      NOTIFY_WEBHOOK_TYPE: "${NOTIFY_WEBHOOK_TYPE:-generic}"
      NOTIFICATION_BATCH_MINUTES: "${NOTIFICATION_BATCH_MINUTES:-1440}"
      DRAFT_REDIS_MEMORY_PERCENT: "${DRAFT_REDIS_MEMORY_PERCENT:-80}"
      RETENTION_ENABLED: "${RETENTION_ENABLED:-true}"
      RETENTION_DAYS: "${RETENTION_DAYS:-1095}"
      MULTI_TENANCY_ENABLED: "${MULTI_TENANCY_ENABLED:-false}"
      DEFAULT_ORG_SLUG: "${DEFAULT_ORG_SLUG:-default}"
      UPDATE_CHECK_ENABLED: "${UPDATE_CHECK_ENABLED:-false}"
      # Installation count: empty = the in-app switch decides (off until an admin
      # agrees); false = always off; true = always on. See docs "Counting installations".
      TELEMETRY_ENABLED: "${TELEMETRY_ENABLED:-}"
      CLAMAV_HOST: "${CLAMAV_HOST:-}"
      CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
      CLAMAV_TIMEOUT_SECONDS: "${CLAMAV_TIMEOUT_SECONDS:-30}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - internal
      - proxy

  tls-init:
    image: ghcr.io/openwhistle/openwhistle:${OPENWHISTLE_VERSION:-2.0.0}
    command: ["python", "scripts/ensure_tls_cert.py", "/certs-in", "/tls", "${TLS_HOSTNAME:-localhost}"]
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # :z relabels for SELinux hosts (shared label; a no-op elsewhere).
      - ./nginx/certs:/certs-in:ro,z
      - tls:/tls
    restart: "no"
    network_mode: none

  nginx:
    image: nginx:alpine
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /var/cache/nginx:size=128m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      # Onion service entry point — reachable only from the host running tor
      # (see docs/docs.html "Offering an onion address"); never exposed publicly.
      - "127.0.0.1:8080:8080"
    volumes:
      # :z relabels for SELinux hosts (shared label; a no-op elsewhere).
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/snippets:/etc/nginx/snippets:ro,z
      - tls:/etc/nginx/tls:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
      app:
        condition: service_started
    restart: always
    networks:
      - proxy

  db:
    image: postgres:18-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-openwhistle}"
      # postgres:18 defaults PGDATA to /var/lib/postgresql/18/docker and refuses
      # to start when /var/lib/postgresql/data is mounted without this.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-openwhistle}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - internal

  redis:
    image: redis:8-alpine
    security_opt:
      - no-new-privileges:true
    # noeviction: sessions and rate-limit counters are never dropped; drafts
    # stop taking attachments at DRAFT_REDIS_MEMORY_PERCENT of maxmemory.
    command: redis-server --save "" --appendonly no --maxmemory 1gb --maxmemory-policy noeviction --requirepass "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - internal

  # Optional upload virus scan. Off unless CLAMAV_HOST is set and
  # this profile is enabled: `COMPOSE_PROFILES=clamav`. Not reachable from the
  # host, and not on `proxy` — nginx has no business reaching clamd, so it
  # shares only `internal` with `app`. `internal` has no internet access, but
  # freshclam (signature updates) needs one to reach database.clamav.net,
  # hence its own `clamav-egress` network instead of the shared `proxy` one.
  clamav:
    image: clamav/clamav:1.4@sha256:a5f03c12a79dbe9f6d8a527b6bb1ea053fa8dd061d3738a26897f055ee2d9303
    profiles: ["clamav"]
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /run:size=16m
      - /var/log/clamav:size=16m
    volumes:
      - clamav_data:/var/lib/clamav
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 6m
    networks:
      - internal
      - clamav-egress

volumes:
  postgres_data:
  tls:
  clamav_data:

networks:
  internal:
    driver: bridge
    internal: true
  # clamd's only route to the internet (freshclam signature updates). Used by
  # no other service — in particular, not shared with nginx's `proxy` network.
  clamav-egress:
    driver: bridge
  proxy:
    driver: bridge
