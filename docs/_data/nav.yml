# Header and footer links. `page` is a translation_key; the link goes to that
# page in the reader's language, or in the default language when it has no
# translation. Every page is either named here or sits under a page that is
# (blog posts under the blog), or is a language home, which the logo links:
# scripts/build_site.py check_nav refuses the rest.
primary:
  - {label: nav.compliance, page: compliance}
  - {label: nav.security, page: security}
  - {label: nav.docs, page: docs}
  - {label: nav.blog, page: blog}
footer:
  - {label: nav.contribute, page: contribute}
  - {label: nav.changelog, page: changelog}
  - {label: nav.roadmap, page: roadmap}
  - {label: nav.compare, page: compare}
  - {label: nav.docs, page: docs}
  - {label: nav.blog, page: blog}
legal: []
# The docs sidebar (docs layout). Labels are plain English: the docs exist in English only (D8).
# build_site.py check_nav: every docs page is listed here, and every entry is a page.
