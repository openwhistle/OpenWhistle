  <nav class="site-nav" role="navigation" aria-label="{{ t.nav.aria }}">
    <div class="nav-inner">
      <a href="/{{ page.lang }}/" class="nav-logo" aria-label="{{ t.nav.home }}">
        <svg class="mark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M7,3 H17 A4,4 0 0 1 21,7 V13 A4,4 0 0 1 17,17 H11.5 L7,20.8 V17 A4,4 0 0 1 3,13 V7 A4,4 0 0 1 7,3 Z M10.60,11.81 A3.5,3.5 0 1 1 13.40,11.81 L14.50,15.4 H9.50 Z"/></svg>
        <span translate="no">OpenWhistle</span>
      </a>

      <button class="nav-toggle" aria-controls="nav-links" aria-expanded="false" aria-label="{{ t.nav.toggle }}">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="nav-links" role="list">
{% for item in nav.primary %}
        <li><a href="{{ item.href }}"{% if page.lang != "en" and item.href.startswith("/en/") %} hreflang="en"{% endif %}{% if item.current %} class="active" aria-current="page"{% endif %}>{{ item.label }}</a></li>
{% endfor %}
{% for language in nav.languages %}
        <li><a href="{{ language.href }}" hreflang="{{ language.lang }}" lang="{{ language.lang }}">{{ language.name }}</a></li>
{% endfor %}
        <li><a href="{{ site.demo_url }}" rel="noopener noreferrer" target="_blank" class="nav-cta">{{ t.nav.demo }}</a></li>
      </ul>

      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="{{ t.nav.theme }}">
          <!-- Moon icon -->
          <svg class="icon-moon" viewBox="0 0 16 16" fill="none">
            <path d="M13.5 9.5A6 6 0 016 2a6 6 0 100 12 6 6 0 007.5-4.5z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <!-- Sun icon -->
          <svg class="icon-sun" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M11.54 4.46l-1.41 1.41M4.95 11.54l-1.41 1.41" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>
