services:
  app:
    build: .
    ports:
      - "4009:4009"
    # SECRET_KEY, ENCRYPTION_KEY and every other setting come from .env
    # (cp .env.example .env). No key is written here: a key in this file is
    # the same key on every Quick Start install.
    env_file:
      - path: .env
        required: false
    environment:
      # Service names; override the localhost that .env.example shows.
      DATABASE_URL: "postgresql+asyncpg://openwhistle:openwhistle@db:5432/openwhistle"
      REDIS_URL: "redis://redis:6379/0"
      # Quick Start serves plain HTTP on :4009.
      SECURE_COOKIES: "${SECURE_COOKIES:-false}"
    volumes:
      - ./app/static:/app/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: openwhistle
      POSTGRES_PASSWORD: openwhistle
      POSTGRES_DB: openwhistle
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwhistle -d openwhistle"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
