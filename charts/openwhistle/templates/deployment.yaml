apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openwhistle.fullname" . }}
  labels:
    {{- include "openwhistle.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # With the HPA on, a rendered count would reset its scaling on every upgrade.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openwhistle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # envFrom is read only at pod start: a changed value must roll the pods.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "openwhistle.selectorLabels" . | nindent 8 }}
    spec:
      # The app talks to no Kubernetes API; a stolen token would be a way out of the pod.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 4009
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "openwhistle.fullname" . }}-config
            - secretRef:
                name: {{ include "openwhistle.secretName" . }}
          # The server listens only after `alembic upgrade head` (app/main.py lifespan):
          # a slow migration would otherwise reach the liveness probe's 105 s budget
          # and crash-loop. Liveness and readiness start once this has passed; it allows
          # 10 minutes (60 x 10 s).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
