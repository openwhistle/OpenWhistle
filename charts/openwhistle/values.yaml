# Default values for openwhistle.
# Override these in your own values file or via --set on the command line.

replicaCount: 1

image:
  repository: ghcr.io/openwhistle/openwhistle
  pullPolicy: IfNotPresent
  tag: ""  # defaults to Chart.appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 4009

ingress:
  enabled: false
  className: ""
  # Whistleblower privacy: the ingress controller sees every client address.
  # - ingress-nginx logs it in its access log by default; the annotation below
  #   turns that log off for this host (or set `disable-access-log: "true"` in
  #   the controller ConfigMap). Its error log still names the client on
  #   errors — keep `error-log-level` at `crit` or ship it nowhere.
  # - ingress-nginx always sends X-Forwarded-For / X-Real-IP upstream and has
  #   no per-Ingress switch to stop it. OpenWhistle drops these headers and the
  #   peer address in its first middleware; nothing in the app sees or logs them.
  # - Traefik keeps access logs off unless enabled. Other controllers: check.
  # Your own annotations are merged with this default (Helm merges maps).
  annotations:
    nginx.ingress.kubernetes.io/enable-access-log: "false"
  hosts:
    - host: whistleblower.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Application configuration — all values end up as environment variables.
config:
  appName: "OpenWhistle"
  demoMode: "false"
  logLevel: "INFO"
  logFormat: "json"
  appPublicUrl: "https://whistleblower.example.com"
  submissionModeEnabled: "true"

  # Absolute admin session lifetime in hours, counted from login (never extended)
  sessionMaxHours: "12"

  # Password-spraying alert: failed admin logins, instance-wide (0 disables)
  adminFailedLoginAlertThreshold: "50"
  adminFailedLoginAlertWindowMinutes: "15"

  # Branding
  brandPrimaryColor: "#0f4c81"
  brandLogoUrl: ""

  # SLA reminders
  reminderEnabled: "false"
  reminderAckWarnDays: "2"
  reminderFeedbackWarnDays: "30"

  # Attachment storage
  storageBackend: "db"
  s3EndpointUrl: ""
  s3BucketName: ""
  s3AccessKeyId: ""
  s3Region: "us-east-1"
  s3Prefix: "attachments/"

  # LDAP / Active Directory
  ldapEnabled: "false"
  ldapServer: ""
  ldapPort: "389"
  ldapUseSsl: "false"
  ldapStartTls: "false"
  ldapBindDn: ""
  ldapBaseDn: ""
  ldapUserFilter: "(uid={username})"
  ldapAttrUsername: "uid"
  ldapAttrEmail: "mail"

  # OIDC / SSO
  oidcEnabled: "false"
  oidcClientId: ""
  oidcServerMetadataUrl: ""
  oidcRedirectUri: ""

  # Email notifications
  notifyEmailEnabled: "false"
  notifyEmailTo: ""
  notifyEmailFrom: "openwhistle@localhost"
  notifySmtpHost: "localhost"
  notifySmtpPort: "587"
  notifySmtpUser: ""
  notifySmtpTls: "true"
  notifySmtpSsl: "false"

  # Webhook notifications
  notifyWebhookEnabled: "false"
  notifyWebhookUrl: ""
  notifyWebhookType: "generic"
  # New reports / whistleblower messages are sent as one digest every N minutes,
  # so their timing reveals nothing. 0 = send each at once.
  notificationBatchMinutes: "60"

  # Refuse new draft attachments above this share of Redis maxmemory.
  draftRedisMemoryPercent: "80"

  # Data retention (GDPR Art. 5 / HinSchG §11 Abs. 5): closed reports are
  # deleted RETENTION_DAYS after closure. On by default since v1.5.0.
  retentionEnabled: "true"
  retentionDays: "1095"

  # Multi-tenancy
  multiTenancyEnabled: "false"
  defaultOrgSlug: "default"

# Secrets — these must be provided; they are not defaulted.
# Create a Kubernetes Secret and reference it, or use an external secrets operator.
secrets:
  # Name of an existing Secret containing the keys listed below.
  # Leave blank to let the chart create a Secret from the values below (not recommended for prod).
  existingSecret: ""
  secretKey: ""         # required — generate with: openssl rand -hex 32
  encryptionKey: ""     # recommended — root of at-rest encryption; unset: secretKey is used
  encryptionKeyPrevious: ""  # optional — comma-separated old keys during a rotation
  databaseUrl: ""       # required — postgresql+asyncpg://user:pass@host:5432/db
  redisUrl: ""          # required — redis://host:6379/0
  setupToken: ""        # optional — unset: a random token is created at startup and logged once
  smtpPassword: ""
  webhookSecret: ""
  s3SecretAccessKey: ""
  ldapBindPassword: ""
  oidcClientSecret: ""

# External PostgreSQL (required — chart does not bundle a DB)
postgresql:
  host: ""
  port: 5432
  database: openwhistle
  username: openwhistle

# External Redis (required — chart does not bundle Redis)
redis:
  host: ""
  port: 6379
  database: 0

nodeSelector: {}
tolerations: []
affinity: {}
